# HRFlow CI — QA §10.5 requirement: "GitHub Actions CI pipeline running all
# tests on every push with pass/fail badge on README."
#
# Backend tests + coverage, frontend build, AND (new) an actual Azure Static
# Web Apps deploy job — the RFP's minimum coverage requirement is explicitly
# "Azure Static Web Apps frontend + FastAPI backend via GitHub Actions
# CI/CD", and this workflow previously stopped at test/build only, with a
# comment saying deployment was "out of scope for this round of fixes."
# The deploy job below only runs on a push to main (not on PRs) and only if
# AZURE_STATIC_WEB_APPS_API_TOKEN is configured as a repo secret (Azure
# generates this token when you first connect the repo in the Azure
# portal — see https://learn.microsoft.com/azure/static-web-apps/deploy-github).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrflow_user
          POSTGRES_PASSWORD: hrflow_pass
          POSTGRES_DB: hrflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrflow_user -d hrflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://hrflow_user:hrflow_pass@localhost:5432/hrflow_test
      JWT_SECRET: ci-test-secret
      USE_MOCK_SSO: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migrations (Alembic)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://hrflow_user:hrflow_pass@localhost:5432/hrflow_test
        run: alembic upgrade head

      # Coverage gate raised from 60% to 80% — the test suite now sits at
      # ~81% (see backend/tests/: attendance, hr_requests, it_requests,
      # notifications, dashboard, and payslips routers all previously had
      # zero dedicated coverage; a RAG retrieval-relevance/groundedness eval
      # suite and a 5-scenario isolated E2E suite were also added), meeting
      # the proposal's own Final Review target (§10.5: "≥80% by final review").
      - name: Run backend tests (Pytest + coverage)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      # QA Report artifact (proposal §10.5: "QA Report: test results summary,
      # per-component coverage metrics, RAG retrieval relevance scores, and
      # groundedness benchmark results") — written by
      # tests/test_rag_eval.py::test_write_rag_eval_report.
      - name: Upload RAG eval report
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: backend/rag_eval_report.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_USE_MOCK_SSO: "true"
        run: npm run build
  deploy-backend:
    # Fixes the RFP's minimum coverage requirement — "FastAPI backend via
    # GitHub Actions CI/CD" — which previously wasn't true at all: Render's
    # own GitHub integration deployed independently of this workflow, on
    # every push, REGARDLESS of whether backend-tests passed. This job
    # makes GitHub Actions the actual trigger, gated behind `needs:
    # [backend-tests]`, so a failing test suite now blocks the backend
    # deploy blocking the deploy the same way a failed build would.
    #
    # Setup (one-time): in the Render dashboard, open the backend service →
    # Settings → Deploy Hook → copy the URL → add it as a GitHub repo
    # secret named RENDER_DEPLOY_HOOK_URL. Then, in that same Render
    # settings page, turn OFF "Auto-Deploy" for the GitHub integration —
    # otherwise Render will keep deploying on every push independently of
    # this gate, defeating the point of wiring it through CI.
    name: Deploy backend to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — skipping backend deploy trigger. Add it under Settings > Secrets and variables > Actions to enable this job."
            exit 0
          fi
          response=$(curl -fsS -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Render responded with HTTP $http_code"
          echo "$body"
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $http_code"
            exit 1
          fi

